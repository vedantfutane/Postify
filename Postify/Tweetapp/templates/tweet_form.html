{% extends "layout.html" %}
{% load static %}

{% block title %}
Postify
{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Welcome to Postify</h1>

    <h2 class="text-center">
        {% if form.instance.pk %}
        Edit Tweet
        {% else %}
        Create Tweet
        {% endif %}
    </h2>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" enctype="multipart/form-data" class="border p-4 shadow-lg rounded">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.as_p }}
                </div>
                <div class="d-flex justify-content-between">
                    <button class="btn btn-warning" type="submit">
                        {% if form.instance.pk %} Update Tweet {% else %} Post Tweet {% endif %}
                    </button>
                    <a href="{% url 'tweet_list' %}" class="btn btn-secondary">Back to Tweet List</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
